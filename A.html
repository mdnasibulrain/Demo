function money(n){
    return `रु. ${Number(n).toLocaleString("en-IN")}`;
}

function discountPercent(regular,price){
    if(!regular) return 0;
    return Math.round(((regular-price)/regular)*100);
}

function Stars({rating=5}){
    return (
        <span className="tracking-tight">
            {[1,2,3,4,5].map(i=>(
                <span key={i} className={i<=Math.round(rating) ? "text-orange-500":"text-slate-300"}>★</span>
            ))}
        </span>
    );
}

function App(){

    const [products,setProducts]=useState(INITIAL_PRODUCTS);

    const [cart,setCart]=useState(()=>{
        try{
            return JSON.parse(localStorage.getItem("studynotes_cart")||"[]");
        }catch{
            return [];
        }
    });

    const [category,setCategory]=useState("all");
    const [search,setSearch]=useState("");
    const [sort,setSort]=useState("featured");

    const [selectedProduct,setSelectedProduct]=useState(null);

    const [cartOpen,setCartOpen]=useState(false);
    const [menuOpen,setMenuOpen]=useState(false);

    const [toast,setToast]=useState("");

    const [previewImage,setPreviewImage]=useState(null);
    const [previewPdf,setPreviewPdf]=useState(false);

    const [adminOpen,setAdminOpen]=useState(false);
    const [policy,setPolicy]=useState(null);

    const [comboIds,setComboIds]=useState([]);

    const [heroIndex,setHeroIndex]=useState(0);

    const [timeLeft,setTimeLeft]=useState({
        hours:5,
        minutes:59,
        seconds:59
    });

    /* =====================================================
       SAVE CART
    ===================================================== */

    useEffect(()=>{
        localStorage.setItem("studynotes_cart",JSON.stringify(cart));
    },[cart]);

    /* =====================================================
       HERO AUTO ROTATION — 20 SECONDS
    ===================================================== */

    useEffect(()=>{
        const timer=setInterval(()=>{
            setHeroIndex(prev=>(prev+1)%products.length);
        },20000);

        return ()=>clearInterval(timer);
    },[products.length]);

    /* =====================================================
       COUNTDOWN
    ===================================================== */

    useEffect(()=>{

        const timer=setInterval(()=>{

            setTimeLeft(prev=>{

                let h=prev.hours;
                let m=prev.minutes;
                let s=prev.seconds;

                if(s>0){
                    s--;
                }else{
                    s=59;

                    if(m>0){
                        m--;
                    }else{
                        m=59;

                        if(h>0){
                            h--;
                        }else{
                            h=5;
                            m=59;
                            s=59;
                        }
                    }
                }

                return {
                    hours:h,
                    minutes:m,
                    seconds:s
                };
            });

        },1000);

        return ()=>clearInterval(timer);

    },[]);

    /* =====================================================
       TOAST
    ===================================================== */

    const showToast=(message)=>{
        setToast(message);
        setTimeout(()=>setToast(""),2800);
    };

    /* =====================================================
       NAVIGATION
    ===================================================== */

    const scrollTo=(id)=>{
        setMenuOpen(false);

        const el=document.getElementById(id);

        if(el){
            el.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        }
    };

    /* =====================================================
       WHATSAPP
    ===================================================== */

    const whatsappOrder=(product)=>{

        const text=
`Hello StudyNotes 👋

I want to order this Ebook:

📚 ${product.title}

💰 Regular Price: ${money(product.regular)}
🔥 Today Price: ${money(product.price)}
💸 Discount: ${product.discount}%

⭐ Rating: ${product.rating}/5

Please send me payment/order instructions.

Thank you.`;

        window.open(
            `https://wa.me/${BRAND.whatsappRaw}?text=${encodeURIComponent(text)}`,
            "_blank"
        );
    };

    /* =====================================================
       ADD TO CART
    ===================================================== */

    const addToCart=(product)=>{

        setCart(prev=>{

            const exists=prev.find(x=>x.id===product.id);

            if(exists){

                return prev.map(x=>
                    x.id===product.id
                    ? {...x,quantity:x.quantity+1}
                    : x
                );

            }

            return [
                ...prev,
                {
                    id:product.id,
                    title:product.title,
                    cover:product.cover,
                    regular:product.regular,
                    price:product.price,
                    quantity:1,
                    type:"Ebook"
                }
            ];
        });

        showToast(`"${product.title}" Cart मा थपियो ✓`);
    };

    /* =====================================================
       ADD BUNDLE
    ===================================================== */

    const addBundle=(bundle)=>{

        const item={
            id:bundle.id,
            title:bundle.title,
            cover:products.find(p=>p.id===bundle.ids[0])?.cover,
            regular:bundle.regular,
            price:bundle.price,
            quantity:1,
            type:"Bundle"
        };

        setCart(prev=>{

            const exists=prev.find(x=>x.id===item.id);

            if(exists){
                return prev.map(x=>
                    x.id===item.id
                    ? {...x,quantity:x.quantity+1}
                    : x
                );
            }

            return [...prev,item];
        });

        showToast("Bundle Cart मा थपियो ✓");
    };

    /* =====================================================
       REMOVE
    ===================================================== */

    const removeCart=(id)=>{
        setCart(prev=>prev.filter(x=>x.id!==id));
    };

    /* =====================================================
       QUANTITY
    ===================================================== */

    const quantity=(id,delta)=>{

        setCart(prev=>
            prev.map(x=>{

                if(x.id!==id) return x;

                const q=x.quantity+delta;

                return q>0
                    ? {...x,quantity:q}
                    : x;

            })
        );
    };

    /* =====================================================
       CART TOTALS
    ===================================================== */

    const cartTotals=useMemo(()=>{

        const regular=cart.reduce(
            (sum,x)=>sum+x.regular*x.quantity,
            0
        );

        const price=cart.reduce(
            (sum,x)=>sum+x.price*x.quantity,
            0
        );

        return {
            regular,
            price,
            savings:regular-price,
            count:cart.reduce((sum,x)=>sum+x.quantity,0)
        };

    },[cart]);

    /* =====================================================
       FILTERED PRODUCTS
    ===================================================== */

    const filteredProducts=useMemo(()=>{

        const q=search.toLowerCase().trim();

        let result=products.filter(p=>{

            const categoryMatch=
                category==="all" ||
                p.category===category;

            const searchMatch=
                !q ||
                p.title.toLowerCase().includes(q) ||
                p.subtitle.toLowerCase().includes(q) ||
                p.tags.some(t=>t.toLowerCase().includes(q));

            return categoryMatch && searchMatch;
        });

        if(sort==="price-low"){
            result.sort((a,b)=>a.price-b.price);
        }

        if(sort==="price-high"){
            result.sort((a,b)=>b.price-a.price);
        }

        if(sort==="discount"){
            result.sort((a,b)=>b.discount-a.discount);
        }

        if(sort==="rating"){
            result.sort((a,b)=>b.rating-a.rating);
        }

        if(sort==="sold"){
            result.sort((a,b)=>b.sold-a.sold);
        }

        return result;

    },[products,category,search,sort]);

       COMBO
    ===================================================== */

    const combo=useMemo(()=>{

        const selected=products.filter(p=>comboIds.includes(p.id));

            (sum,p)=>sum+p.regular,
            0
        );

        const sale=selected.reduce(
            (sum,p)=>sum+p.price,
            0
        );

        let rate=0;

        if(selected.length>=3){
            rate=.20;
        }else if(selected.length>=2){
            rate=.15;
        }

        const discount=Math.round(sale*rate);

        return {
            selected,
            regular,
            sale,
            discount,
            final:sale-discount,
            rate:rate*100,
            savings:regular-(sale-discount)
        };

    },[comboIds,products]);

       ADD COMBO
