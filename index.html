/* =========================================================
   HELPER FUNCTIONS
========================================================= */

function money(value) {
    return `रु. ${Number(value).toLocaleString("en-IN")}`;
}


function discountPercent(regular, sale) {
    if (!regular) return 0;

    return Math.round(
        ((regular - sale) / regular) * 100
    );
}


function whatsappLink(message) {

    return (
        "https://wa.me/" +
        BRAND.whatsappRaw +
        "?text=" +
        encodeURIComponent(message)
    );
}


function productWhatsAppMessage(product) {

    return `
Hello StudyNotes 👋

I want to order this Ebook:

📚 ${product.title}

💰 Price: ${money(product.salePrice)}
🏷️ Regular Price: ${money(product.regularPrice)}
💸 Discount: ${discountPercent(product.regularPrice, product.salePrice)}%

Please send me the payment instructions through NSPAY.

Name:
WhatsApp:
Delivery Email (optional):
`.trim();
}


function bundleWhatsAppMessage(bundle, products) {

    const names = bundle.products
        .map(id => {
            const p = products.find(x => x.id === id);
            return p ? `• ${p.title}` : "";
        })
        .join("\n");

    return `
Hello StudyNotes 👋

I want to order:

🎁 ${bundle.title}

Included:
${names}

💰 Bundle Price: ${money(bundle.salePrice)}
🏷️ Regular Value: ${money(bundle.regularPrice)}
💸 Savings: ${money(bundle.regularPrice - bundle.salePrice)}

Please send me NSPAY payment instructions.

Name:
WhatsApp:
Delivery Email:
`.trim();
}


function cartWhatsAppMessage(cart, total) {

    const items = cart
        .map(item =>
            `• ${item.title} × ${item.quantity} — ${money(item.salePrice * item.quantity)}`
        )
        .join("\n");

    return `
Hello StudyNotes 👋

I want to order the following:

${items}

💰 Total: ${money(total)}

Please send me NSPAY payment instructions.

Name:
WhatsApp:
Delivery Email:
`.trim();
}

function Stars({ rating = 5 }) {

    return (
        <span className="stars text-orange-500 text-sm">

                    {index < Math.round(rating) ? "★" : "☆"}

            ))}

    );
}

    ===================================================== */

    function addToCart(product) {

        setCart(previous => {

            const exists =
                previous.find(
                    item => item.id === product.id
                );

            if (exists) {

                return previous.map(item =>
                    item.id === product.id
                        ? {
                            ...item,
                            quantity:
                                item.quantity + 1
                        }
                        : item
                );

            }

            return [
                ...previous,
                {
                    ...product,
                    quantity: 1
                }
            ];

        });

            `"${product.title}" Cart मा थपियो`

    function removeCartItem(id) {

        setCart(
            previous =>
                previous.filter(

                )
        );

    }


    function changeQuantity(id, amount) {

        setCart(previous =>
            previous.map(item => {

                if (item.id !== id)
                    return item;

                const quantity =
                    Math.max(
                        1,
                        item.quantity + amount
                    );

                return {
                    ...item,
                    quantity

            })
        );

    const cartTotal = useMemo(() => {

/* =========================================================
   ADMIN / PRODUCT MANAGER
   Hidden route:
   #/mnradmin
========================================================= */

function AdminPanel({
    products,
    setProducts
}) {

    const [saved, setSaved] =
        useState(false);


    function updateProduct(
        id,
        field,
        value
    ) {

        setProducts(previous =>
            previous.map(product =>
                product.id === id
                    ? {
                        ...product,
                        [field]:
                            field ===
                            "salePrice" ||
                            field ===
                            "regularPrice" ||
                            field ===
                            "stock" ||
                            field ===
                            "sold"
                                ? Number(value)
                                : value
                    }
                    : product
            )
        );

    }


    function saveLocal() {

        localStorage.setItem(
            "studynotes_products",
            JSON.stringify(products)
        );

        setSaved(true);

        setTimeout(
            () => setSaved(false),
            2000
        );

    }


    return (

        <div className="
            min-h-screen
            bg-slate-50
            p-4
            md:p-8
        ">

            <div className="
                max-w-6xl
                mx-auto

                    rounded-3xl
                    border
                    border-orange-200
                    p-5

                    shadow-sm

                                font-black

                                text-2xl
                                md:text-3xl
                                font-black
                            ">
                                Product Manager
                            </h1>

                            <p className="
                                text-xs
                                text-slate-500
                                mt-1
                            ">
                                Manual local product management.
                            </p>

                        </div>


                        <div className="
                            flex
                            gap-2
                        ">

                            <button
                                onClick={saveLocal}
                                className="
                                    px-4
                                    py-2.5
                                    bg-orange-500
                                    text-white
                                    rounded-xl
                                    text-xs
                                    font-black
                                "
                            >
                                {saved
                                    ? "Saved ✓"
                                    : "Save Changes"}
                            </button>


                            <button
                                onClick={() => {
                                    window.location.hash = "";
                                    window.location.reload();
                                }}
                                className="
                                    px-4
                                    py-2.5
                                    bg-slate-100
                                    rounded-xl
                                    text-xs
                                    font-black
                                "
                            >
                                Storefront
                            </button>

                        </div>

                    </div>


                    <div className="
                        mt-7
                        space-y-4
                    ">

                        {products.map(
                            product => (

                                <div
                                    key={
                                        product.id
                                    }
                                    className="
                                        border
                                        border-slate-200
                                        rounded-2xl
                                        p-4
                                    "
                                >

                                    <div className="
                                        flex
                                        gap-4
                                    ">

                                        <img
                                            src={
                                                product.cover
                                            }
                                            className="
                                                w-20
                                                h-24
                                                rounded-xl
                                                object-cover
                                                shrink-0
                                            "
                                        />


                                        <div className="
                                            flex-1
                                        ">

                                            <h3 className="
                                                text-sm
                                                font-black
                                            ">
                                                {product.title}
                                            </h3>


                                            <div className="
                                                grid
                                                grid-cols-2
                                                md:grid-cols-4
                                                gap-2
                                                mt-3
                                            ">

                                                <AdminInput
                                                    label="Sale Price"
                                                    value={
                                                        product.salePrice
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,
                                                                "salePrice",
                                                                value
                                                            )
                                                    }
                                                />


                                                <AdminInput
                                                    label="Regular Price"
                                                    value={
                                                        product.regularPrice
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,
                                                                "regularPrice",
                                                                value
                                                            )
                                                    }
                                                />


                                                <AdminInput
                                                    label="Available Copies"
                                                    value={
                                                        product.stock
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,
                                                                "stock",
                                                                value
                                                            )
                                                    }
                                                />


                                                <AdminInput
                                                    label="Sold Copies"
                                                    value={
                                                        product.sold
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,
                                                                "sold",
                                                                value
                                                            )
                                                    }
                                                />

                                            </div>


                                            <div className="
                                                grid
                                                grid-cols-1
                                                md:grid-cols-2
                                                gap-2
                                                mt-2
                                            ">

                                                <AdminText
                                                    label="Cover Image URL"
                                                    value={
                                                        product.cover
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,

                                                                value
                                                            )
                                                    }
                                                />


                                                <AdminText

                                                        product.badge
                                                    }
                                                    onChange={
                                                        value =>
                                                            updateProduct(
                                                                product.id,
                                                                "badge",
                                                                value
                                                            )
                                                    }
                                                />

                                            </div>


                                            <label className="
                                                flex
                                                items-center
                                                gap-2
                                                mt-3
                                                text-xs
                                                font-bold
                                            ">

                                                <input
                                                    type="checkbox"
                                                    checked={
                                                        product.published
                                                    }
                                                    onChange={
                                                        e =>
                                                            updateProduct(
                                                                product.id,
                                                                "published",
                                                                e.target.checked
                                                            )
                                                    }
                                                />

                                                Published

                                            </label>

                                        </div>

                                    </div>

                                </div>

                            )
                        )}

                    </div>

                </div>

            </div>

        </div>

    );
}

/* =========================================================
   LOAD SAVED LOCAL PRODUCTS
========================================================= */

try {

    const savedProducts =
        localStorage.getItem(
            "studynotes_products"
        );

    if (savedProducts) {

        const parsed =
            JSON.parse(
                savedProducts
            );

        if (
            Array.isArray(parsed) &&
            parsed.length
        ) {

            /*
             * This replaces initial data before
             * React is mounted.
             */
            INITIAL_PRODUCTS.splice(
                0,
                INITIAL_PRODUCTS.length,
                ...parsed
            );

        }

    }

} catch (error) {

    console.warn(
        "Could not load local StudyNotes products.",
        error
    );

}
