function formatRs(value) {
    return `रु. ${Number(value).toLocaleString("en-IN")}`;
}

function getDiscount(regular, sale) {
    return Math.round(((regular - sale) / regular) * 100);
}

function Stars({ rating = 5, small = false }) {
    return (
        <span className={small ? "text-[10px]" : "text-xs"}>
            {"★★★★★".split("").map((star, i) => (
                <span key={i} className={i < Math.round(rating) ? "text-orange-500" : "text-slate-300"}>
                    {star}
                </span>
            ))}
        </span>
    );
}

function StockBar({ product }) {

    return (
        <div className="space-y-1.5">

                    style={{ width: `${percentage}%` }}
                />

        </div>
    );
}


/* ============================================================
   TIMER
============================================================ */

function Countdown() {
    const [seconds, setSeconds] = useState(4 * 60 * 60 + 37 * 60 + 12);

    useEffect(() => {
        const timer = setInterval(() => {
            setSeconds(prev => prev > 0 ? prev - 1 : 4 * 60 * 60 + 37 * 60 + 12);
        }, 1000);

        return () => clearInterval(timer);
    }, []);

    const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");

    return (
        <span className="font-black tabular-nums">
            {h}:{m}:{s}
        </span>
    );
}

                            quantity: item.quantity + 1

        setCart(previous => [

    function changeQuantity(id, amount) {
        setCart(previous =>

                return {

        );

    const totals = useMemo(() => {

        const regular = cart.reduce(
            (sum, item) => sum + item.regular * item.quantity,

        const final = cart.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0
        );

        return {

            final,
            savings: regular - final,
            count: cart.reduce((sum, item) => sum + item.quantity, 0)
        };

    ======================================================== */

    const comboCalculation = useMemo(() => {

        const selected = products.filter(
            p => comboIds.includes(p.id)

        const regular = selected.reduce(
            (sum, p) => sum + p.regularPrice,
            0
        );

        const today = selected.reduce(
            (sum, p) => sum + p.salePrice,
            0
        );

        let comboDiscount = 0;

        if (selected.length >= 2) {
            comboDiscount = Math.round(today * 0.15);
        }

        if (selected.length >= 4) {
            comboDiscount = Math.round(today * 0.20);

        if (selected.length >= 6) {

        const final = today - comboDiscount;

                                                <p className="text-[9px] text-slate-400 font-bold">
                                                    REGULAR
                                                </p>

                                                <p className="mt-1 text-sm font-black line-through text-slate-400">
                                                    {formatRs(activeProduct.regularPrice)}
                                                </p>
                                            </div>

                                            <div>
                                                <p className="text-[9px] text-orange-600 font-black">
                                                    DISCOUNT
                                                </p>

                                                <p className="mt-1 text-xl font-black text-orange-600">
                                                    {activeProduct.discount}%
                                                </p>
                                            </div>

                                            <div>
                                                <p className="text-[9px] text-green-600 font-black">
                                                    TODAY
                                                </p>

                                                <p className="mt-1 text-xl font-black">
                                                    {formatRs(activeProduct.salePrice)}
                                                </p>
                                            </div>

                                        </div>

                                    </div>


                                    {/* Urgency */}

                                    <div className="mt-4 rounded-xl bg-slate-950 text-white p-4 flex items-center justify-between">

                                        <div className="flex items-center gap-2">

                                            <span className="live-dot w-2 h-2 rounded-full bg-orange-500"></span>

                                            <div>
                                                <p className="text-[9px] text-orange-300 font-black">
                                                    LIMITED AVAILABILITY
                                                </p>

                                                <p className="text-xs font-bold">
                                                    Only {activeProduct.available} copies left
                                                </p>
                                            </div>

                                        </div>

                                        <div className="text-right">

                                            <p className="text-[8px] text-slate-400">
                                                Offer ends
                                            </p>

                                            <p className="text-sm text-orange-400 font-black">
                                                <Countdown />
                                            </p>

                                        </div>

                                    </div>


                                    <div className="mt-3">
                                        <StockBar product={activeProduct} />
                                    </div>


                                    {/* Main CTA */}

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-5">

                                        <button
                                            onClick={() => {
                                                addProduct(activeProduct);
                                                setCartOpen(true);
                                            }}
                                            className="py-3.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-black text-xs shadow-lg"
                                        >
                                            🛒 Add to Cart — {formatRs(activeProduct.salePrice)}
                                        </button>

                                        <button
                                            onClick={() => whatsappOrder([], activeProduct)}
                                            className="py-3.5 rounded-xl bg-green-600 hover:bg-green-700 text-white font-black text-xs"
                                        >
                                            💬 Order via WhatsApp
                                        </button>

                                    </div>

                                    <a
                                        href={BRAND.nspay}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="mt-2 block w-full py-3 rounded-xl border border-orange-300 bg-white hover:bg-orange-50 text-orange-700 text-center text-xs font-black"
                                    >
                                        💳 Continue to NSPAY Payment
                                    </a>


                                    <p className="mt-3 text-center text-[9px] text-slate-400">
                                        Payment verification पछि WhatsApp/Email delivery in {BRAND.delivery}.
                                    </p>

                                </div>

                            </div>

                        </div>

                    </section>


                    {/* Detail body */}

                    <section className="py-10">

                        <div className="max-w-6xl mx-auto px-4">

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">

                                <div className="lg:col-span-2 space-y-5">

                                    {/* Overview */}

                                    <div className="border border-slate-200 rounded-2xl p-5">

                                        <span className="text-orange-600 text-[9px] font-black uppercase tracking-widest">
                                            WHY THIS EBOOK
                                        </span>

                                        <h2 className="mt-2 text-xl font-black">
                                            तपाईंलाई यसबाट के फाइदा हुन्छ?
                                        </h2>

                                        <p className="mt-3 text-xs text-slate-600 leading-relaxed">
                                            {activeProduct.description}
                                        </p>

                                    </div>


                                    {/* Outcomes */}

                                    <div className="border border-slate-200 rounded-2xl p-5">

                                        <h2 className="text-lg font-black">
                                            📚 Learning Outcomes
                                        </h2>

                                        <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-2">

                                            {activeProduct.outcomes.map(
                                                (outcome, index) => (

                                                    <div
                                                        key={index}
                                                        className="flex gap-2 p-3 bg-orange-50/50 rounded-xl"
                                                    >
                                                        <span className="text-green-600 font-black">
                                                            ✓
                                                        </span>

                                                        <span className="text-[10px] text-slate-600 leading-relaxed">
                                                            {outcome}
                                                        </span>
                                                    </div>

                                                )
                                            )}

                                        </div>

                                    </div>


                                    {/* Chapters */}

                                    <div className="border border-slate-200 rounded-2xl p-5">

                                        <h2 className="text-lg font-black">
                                            📖 Inside the Ebook
                                        </h2>

                                        <div className="mt-4 space-y-2">

                                            {activeProduct.chaptersList.map(
                                                (chapter, index) => (

                                                    <div
                                                        key={index}
                                                        className="flex items-center gap-3 p-3 rounded-xl border border-slate-100"
                                                    >

                                                        <div className="w-7 h-7 rounded-lg bg-orange-100 text-orange-700 flex items-center justify-center text-[9px] font-black">
                                                            {String(index + 1).padStart(2, "0")}
                                                        </div>

                                                        <span className="text-xs font-bold">
                                                            {chapter}
                                                        </span>

                                                    </div>

                                                )
                                            )}

                                        </div>

                                    </div>


                                    {/* Product reviews */}

                                    <div className="border border-slate-200 rounded-2xl p-5">

                                        <div className="flex justify-between items-center">

                                            <h2 className="text-lg font-black">
                                                ⭐ Learner Reviews
                                            </h2>

                                            <div className="text-right">
                                                <p className="text-xl font-black">
                                                    {activeProduct.rating}
                                                </p>
                                                <Stars rating={activeProduct.rating} small />
                                            </div>

                                        </div>

                                        <div className="mt-5 grid grid-cols-1 md:grid-cols-2 gap-3">

                                            {[
                                                "Content व्यवस्थित र practical छ।",
                                                "Revision गर्न र concepts बुझ्न सजिलो लाग्यो।",
                                                "Beginner को लागि language र structure राम्रो छ।",
                                                "Price अनुसार resource useful लाग्यो।"
                                            ].map((text, index) => (

                                                <div
                                                    key={index}
                                                    className="p-4 bg-slate-50 rounded-xl"
                                                >

                                                    <Stars rating={5} small />

                                                    <p className="mt-2 text-[10px] text-slate-600 leading-relaxed">
                                                        “{text}”
                                                    </p>

                                                    <p className="mt-2 text-[8px] text-slate-400">
                                                        Learner feedback
                                                    </p>

                                                </div>

                                            ))}

                                        </div>

                                    </div>

                                </div>


                                {/* Right conversion panel */}

                                <aside className="space-y-4">

                                    <div className="lg:sticky lg:top-20 border-2 border-orange-200 rounded-2xl p-5 bg-orange-50/60">

                                        <h3 className="font-black">
                                            Ready to Start?
                                        </h3>

                                        <p className="mt-2 text-[10px] text-slate-500">
                                            आजको offer मा यो resource सुरक्षित गर्नुहोस्।
                                        </p>


                                        <div className="mt-5">

                                            <p className="text-[9px] text-slate-400 line-through">
                                                Regular: {formatRs(activeProduct.regularPrice)}
                                            </p>

                                            <p className="text-2xl font-black text-orange-600">
                                                {formatRs(activeProduct.salePrice)}
                                            </p>

                                            <p className="text-[10px] text-green-700 font-black">
                                                Save {formatRs(
                                                    activeProduct.regularPrice -
                                                    activeProduct.salePrice
                                                )}
                                            </p>

                                        </div>


                                        <button
                                            onClick={() => {
                                                addProduct(activeProduct);
                                                setCartOpen(true);
                                            }}
                                            className="mt-5 w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-black text-xs shadow"
                                        >
                                            🛒 Get This Ebook
                                        </button>


                                        <button
                                            onClick={() => whatsappOrder([], activeProduct)}
                                            className="mt-2 w-full py-3.5 bg-green-600 hover:bg-green-700 text-white rounded-xl font-black text-xs"
                                        >
                                            💬 WhatsApp Order
                                        </button>


                                        <a
                                            href={BRAND.nspay}
                                            target="_blank"
                                            rel="noreferrer"
                                            className="mt-2 block w-full py-3 rounded-xl border border-orange-300 bg-white text-center text-orange-700 font-black text-xs"
                                        >
                                            💳 NSPAY
                                        </a>


                                        <div className="mt-4 pt-4 border-t border-orange-200 space-y-2 text-[9px] text-slate-500">

                                            <p>✓ Digital PDF format</p>
                                            <p>✓ Mobile & laptop friendly</p>
                                            <p>✓ WhatsApp / Email delivery</p>
                                            <p>✓ Delivery after payment verification</p>

                                        </div>

                                    </div>

                                </aside>

                            </div>


                            {/* Suggested books */}

                            <div className="mt-12">

                                <div className="flex items-end justify-between">

                                    <div>
                                        <span className="text-orange-600 text-[9px] font-black uppercase tracking-widest">
                                            YOU MAY ALSO LIKE
                                        </span>

                                        <h2 className="mt-1 text-xl font-black">
                                            More StudyNotes Resources
                                        </h2>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setActiveProduct(null);
                                            goTo("library");
                                        }}
                                        className="text-[9px] font-black text-orange-600"
                                    >
                                        View All →
                                    </button>

                                </div>


                                <div className="mt-5 grid grid-cols-2 md:grid-cols-4 gap-3">

                                    {products
                                        .filter(p => p.id !== activeProduct.id)
                                        .slice(0, 4)
                                        .map(product => (

                                            <button
                                                key={product.id}
                                                onClick={() => setActiveProduct(product)}
                                                className="text-left border border-orange-100 rounded-xl overflow-hidden hover:border-orange-400 transition"
                                            >

                                                <ProductCover
                                                    product={product}
                                                    compact
                                                />

                                                <div className="p-2">

                                                    <p className="text-[10px] font-black line-clamp-2">
                                                        {product.title}
                                                    </p>

                                                    <p className="mt-1 text-xs text-orange-600 font-black">
                                                        {formatRs(product.salePrice)}
                                                    </p>

                                                </div>

                                            </button>

                                        ))}

                                </div>

                            </div>

                        </div>

                    </section>


                    {/* Detail bottom sticky CTA */}

                    <div className="sticky bottom-0 z-30 bg-white/95 backdrop-blur border-t border-orange-200 shadow-[0_-5px_25px_rgba(15,23,42,.08)]">

                        <div className="max-w-6xl mx-auto px-3 py-2.5 flex items-center gap-2">

                            <div className="hidden sm:block flex-1 min-w-0">

                                <p className="text-[9px] text-slate-400 line-clamp-1">
                                    {activeProduct.title}
                                </p>

                                <p className="text-base font-black text-orange-600">
                                    {formatRs(activeProduct.salePrice)}
                                </p>

                            </div>

                            <button
                                onClick={() => {
                                    addProduct(activeProduct);
                                    setCartOpen(true);
                                }}
                                className="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-orange-500 text-white text-[10px] font-black"
                            >
                                🛒 Add to Cart
                            </button>

                            <button
                                onClick={() => whatsappOrder([], activeProduct)}
                                className="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-green-600 text-white text-[10px] font-black"
                            >
                                💬 WhatsApp
                            </button>

                        </div>

                    </div>

                </div>

            )}

        </div>
    );
}


/* ============================================================
   MOUNT
============================================================ */

ReactDOM.createRoot(
    document.getElementById("root")
).render(
    <App />
);

</script>
</body>
</html>
