    if (product.discount) {
        return product.discount;
    }

    return Math.round(
        ((product.regularPrice - product.salePrice) /
            product.regularPrice) * 100
    );
}


function whatsappProductUrl(product, quantity = 1) {

    const message = encodeURIComponent(
        `नमस्कार StudyNotes,

म यो Ebook Order गर्न चाहन्छु।

📚 ${product.title}

💰 Price: ${formatRs(product.salePrice)}
📦 Quantity: ${quantity}

कृपया Payment र Delivery Process बताइदिनुहोस्।

धन्यवाद।`
    );

    return `https://wa.me/${BRAND.whatsappNumber}?text=${message}`;
}


function whatsappCartUrl(cart, total) {

    const items = cart
        .map(
            (item, index) =>
                `${index + 1}. ${item.title} × ${item.quantity} — ${formatRs(
                    item.salePrice * item.quantity
                )}`
        )
        .join("\n");

    const message = encodeURIComponent(
        `नमस्कार StudyNotes,

म तलका Ebooks Order गर्न चाहन्छु:

${items}

💰 Total: ${formatRs(total)}

कृपया NSPAY Payment Process पठाइदिनुहोस्।

धन्यवाद।`
    );

    return `https://wa.me/${BRAND.whatsappNumber}?text=${message}`;
}

                product.title.toLowerCase().includes(query) ||

                product.tags.some(tag =>

        selectedProducts.reduce(
            (sum, product) => sum + product.regularPrice,
            0
        );


    const normalSale =
        selectedProducts.reduce(
            (sum, product) => sum + product.salePrice,
            0
        );


    const extra =
        selectedProducts.length >= 2
            ? Math.round(normalSale * .15)
            : 0;


    const final =
        Math.max(0, normalSale - extra);


    return (

        <section id="combos" className="py-10 bg-rose-50/40 border-y border-rose-100">

            <div className="app-container px-4">

                <div className="text-center mb-7">

                    <span className="text-[9px] font-black text-rose-600 uppercase tracking-wider">

                    <p className="text-xs text-slate-500 mt-2">
                        २ वा बढी Ebook छान्नुहोस् र थप १५% combo discount पाउनुहोस्।
                    </p>

                </div>


                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">

                    {/* PRODUCTS */}

                    <div className="lg:col-span-8 grid grid-cols-2 md:grid-cols-3 gap-3">

                        {products.map(product => {

                            const checked =
                                selected.includes(product.id);

                            return (

                                <button
                                    key={product.id}
                                    onClick={() => {

                                        if (checked) {

                                            setSelected(
                                                selected.filter(
                                                    id =>
                                                        id !== product.id
                                                )
                                            );

                                        } else {

                                            setSelected([
                                                ...selected,
                                                product.id
                                            ]);

                                        }

                                    }}
                                    className={
                                        `text-left rounded-2xl border-2 overflow-hidden transition ${
                                            checked
                                                ? "border-rose-500 bg-rose-50"
                                                : "border-slate-200 bg-white"
                                        }`
                                    }
                                >

                                    <div className="relative">

                                        <img
                                            src={product.cover}
                                            className="w-full aspect-[4/5] object-cover"
                                        />

                                        {checked && (

                                            <div className="absolute top-2 right-2 w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center">
                                                ✓

                                        )}

                                    <div className="p-2.5">

                                        <div className="text-[10px] font-black text-slate-900 line-clamp-2">
                                            {product.title}

                                    </div>

                            );

                    {/* SUMMARY */}

                    <div className="lg:col-span-4">

                        <div className="sticky top-28 bg-white rounded-2xl border border-rose-200 p-5 product-shadow">

                            <div className="text-[9px] text-rose-600 font-black uppercase">
                                Your Combo
                            </div>

                            <h3 className="font-black text-lg mt-1">
                                {selectedProducts.length} Ebooks Selected
                            </h3>


                            <div className="space-y-2 mt-5 text-xs">

                                <div className="flex justify-between text-slate-500">
                                    <span>Regular Price</span>
                                    <span className="line-through">
                                        {formatRs(regular)}
                                    </span>
                                </div>

                                <div className="flex justify-between text-slate-500">

                                    <span>
                                        {formatRs(normalSale)}
                                    </span>
                                </div>

                                <span className="text-2xl font-black text-rose-600">

/* =========================================================
   SEARCH OVERLAY
========================================================= */

function SearchOverlay({
    products,
    onClose,
    onOpen
}) {

    const [query, setQuery] = useState("");

    const results = products.filter(product => {

        const q = query.toLowerCase().trim();

        if (!q) return false;

        return (
            product.title.toLowerCase().includes(q) ||
            product.subtitle.toLowerCase().includes(q) ||
            product.tags.some(tag =>
                tag.toLowerCase().includes(q)
            )
        );

    });


    return (

        <div className="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-sm flex items-start justify-center p-4">

            <div className="w-full max-w-xl bg-white rounded-2xl mt-12 overflow-hidden shadow-2xl">

                <div className="p-4 border-b border-slate-100 flex items-center gap-2">

                    <Icon
                        name="search"
                        size={18}
                    />

                    <input
                        autoFocus
                        value={query}
                        onChange={e =>
                            setQuery(e.target.value)
                        }
                        placeholder="Search StudyNotes ebooks..."
                        className="flex-1 outline-none text-sm"
                    />

                    <button
                        onClick={onClose}
                        className="w-8 h-8 rounded-lg bg-slate-100"
                    >
                        ×
                    </button>

                </div>


                <div className="max-h-[70vh] overflow-y-auto p-3">

                    {!query && (

                        <div className="py-10 text-center text-slate-400 text-xs">
                            Search by title, category or skill.
                        </div>

                    )}


                    {query && results.length === 0 && (

                        <div className="py-10 text-center text-slate-500 text-xs">
                            कुनै Ebook भेटिएन।
                        </div>

                    )}


                    <div className="space-y-2">

                        {results.map(product => (

                            <button
                                key={product.id}
                                onClick={() => {
                                    onClose();
                                    onOpen(product);
                                }}
                                className="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 text-left"
                            >

                                <img
                                    src={product.cover}

/* =========================================================
   CART DRAWER
========================================================= */

function CartDrawer({
    cart,
    setCart,
    onClose,
    onOpenProduct
}) {

    const total = cart.reduce(
        (sum, item) =>
            sum + item.salePrice * item.quantity,
        0
    );


    const regular = cart.reduce(
        (sum, item) =>
            sum + item.regularPrice * item.quantity,
        0
    );


    const savings = regular - total;


    const updateQuantity = (id, amount) => {

        setCart(current =>

            current
                .map(item => {

                    if (item.id !== id) {
                        return item;
                    }

                    return {
                        ...item,
                        quantity:
                            item.quantity + amount
                    };

                })
                .filter(item =>
                    item.quantity > 0
                )

        );

    };


    return (

        <div className="fixed inset-0 z-[90] bg-slate-950/60 backdrop-blur-sm">

            <div className="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col">

                {/* HEADER */}

                <div className="p-4 border-b border-slate-100 flex items-center justify-between">

                    <div>

                        <div className="text-[9px] text-rose-600 font-black uppercase">
                            StudyNotes
                        </div>

                        <h2 className="text-lg font-black">
                            Your Cart
                        </h2>

                    </div>

                    <button
                        onClick={onClose}
                        className="w-9 h-9 rounded-xl bg-slate-100 font-bold"
                    >
                        ×
                    </button>

                </div>


                {/* ITEMS */}

                <div className="flex-1 overflow-y-auto p-4">

                    {cart.length === 0 ? (

                        <div className="py-20 text-center">

                            <div className="text-5xl">
                                🛒
                            </div>

                            <h3 className="font-black mt-3">
                                Cart खाली छ
                            </h3>

                            <p className="text-xs text-slate-500 mt-1">
                                आफ्नो मनपर्ने Ebook थप्नुहोस्।
                            </p>

                        </div>

                    ) : (

                        <div className="space-y-3">

                            {cart.map(item => (

                                <div
                                    key={item.id}
                                    className="border border-slate-200 rounded-2xl p-3"
                                >

                                    <div className="flex gap-3">

                                        <img
                                            src={item.cover}
                                            className="w-16 h-20 rounded-xl object-cover"
                                        />

                                        <div className="flex-1 min-w-0">

                                            <button
                                                onClick={() =>
                                                    onOpenProduct(item.product)
                                                }
                                                className="text-left font-black text-xs line-clamp-2"
                                            >
                                                {item.title}
                                            </button>

                                            <div className="text-[9px] text-slate-400 mt-1">
                                                {item.type}
                                            </div>

                                            <div className="text-sm font-black text-rose-600 mt-2">
                                                {formatRs(item.salePrice)}
                                            </div>

                                        </div>

                                    </div>


                                    <div className="flex items-center justify-between mt-3">

                                        <div className="flex items-center gap-2">

                                            <button
                                                onClick={() =>
                                                    updateQuantity(
                                                        item.id,
                                                        -1
                                                    )
                                                }
                                                className="w-7 h-7 rounded-lg bg-slate-100 font-black"
                                            >
                                                −
                                            </button>

                                            <span className="text-xs font-black">
                                                {item.quantity}
                                            </span>

                                            <button
                                                onClick={() =>
                                                    updateQuantity(
                                                        item.id,
                                                        1
                                                    )
                                                }
                                                className="w-7 h-7 rounded-lg bg-slate-100 font-black"
                                            >
                                                +
                                            </button>

                                        </div>


                                        <button
                                            onClick={() =>
                                                setCart(current =>
                                                    current.filter(
                                                        x =>
                                                            x.id !== item.id
                                                    )
                                                )
                                            }

                            💬 WhatsApp Order
                        </a>

                    </div>

                </div>

            </div>

        </div>
    );
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

function BottomNavigation({
    active,
    onHome,
    onEbooks,
    onCart,
    onOffers,
    onSupport,
    cartCount
}) {

    return (

        <nav className="md:hidden fixed bottom-0 left-0 right-0 z-[70]">

            <div className="mx-2 mb-2 bg-white/95 backdrop-blur-xl border border-slate-200 rounded-2xl shadow-2xl">

                <div className="h-16 grid grid-cols-5 items-center">

                    <button
                        onClick={onHome}
                        className="flex flex-col items-center gap-1"
                    >

                        <Icon
                            name="home"
                            size={17}
                            className={
                                active === "home"
                                    ? "text-rose-600"
                                    : "text-slate-500"
                            }
                        />

                        <span className="text-[8px] font-black">
                            Home
                        </span>

                    </button>


                    <button
                        onClick={onEbooks}
                        className="flex flex-col items-center gap-1"
                    >

                        <Icon
                            name="book-open"
                            size={17}
                        />

                        <span className="text-[8px] font-black">
                            Ebooks
                        </span>

                    </button>


                    {/* CENTER */}

                    <button
                        onClick={onCart}
                        className="relative flex justify-center"
                    >

                        <span className="center-nav-button -mt-8 w-14 h-14 rounded-full red-gradient text-white border-4 border-white flex items-center justify-center">

                            <Icon
                                name="shopping-cart"
                                size={22}
                            />

                        </span>

                        {cartCount > 0 && (

                            <span className="absolute -top-7 right-3 w-5 h-5 rounded-full bg-slate-950 text-white text-[8px] font-black flex items-center justify-center border-2 border-white">
                                {cartCount}
                            </span>

                        )}

                    </button>


                    <button
                        onClick={onOffers}
                        className="flex flex-col items-center gap-1"
                    >

                        <Icon
                            name="tag"
                            size={17}
                        />

                        <span className="text-[8px] font-black">
                            Offers
                        </span>

                    </button>


                    <button
                        onClick={onSupport}
                        className="flex flex-col items-center gap-1"
                    >

                        <Icon
                            name="message-circle"
                            size={17}
                        />

                        <span className="text-[8px] font-black">
                            Support
                        </span>

                    </button>

                </div>

            </div>

        </nav>
    );
}


/* =========================================================
   MAIN APP
========================================================= */

function App() {

    const [products] = useState(INITIAL_PRODUCTS);

    const [heroIndex, setHeroIndex] = useState(0);

    const [selectedCategory, setSelectedCategory] =
        useState("all");

    const [searchQuery, setSearchQuery] =
        useState("");

    const [cart, setCart] = useState(() => {

        try {

            const saved =
                localStorage.getItem(
                    "studynotes-cart"
                );

            return saved
                ? JSON.parse(saved)
                : [];

        } catch {

            return [];

        }

    });


    const [activeProduct, setActiveProduct] =
        useState(null);

    const [cartOpen, setCartOpen] =
        useState(false);

    const [searchOpen, setSearchOpen] =
        useState(false);

    const [comboSelected, setComboSelected] =
        useState([]);


    /* =====================================================
       LOCAL STORAGE
    ===================================================== */

    useEffect(() => {

        try {

            localStorage.setItem(
                "studynotes-cart",
                JSON.stringify(cart)
            );

        } catch {}

    }, [cart]);


    /* =====================================================
       HERO 20 SECOND ROTATION
    ===================================================== */

    useEffect(() => {

        const timer =
            setInterval(() => {

                setHeroIndex(
                    current =>
                        (current + 1) %
                        products.length
                );

            }, 20000);

        return () =>
            clearInterval(timer);

    }, [products.length]);


    /* =====================================================
       CART COUNT
    ===================================================== */

    const cartCount = cart.reduce(
        (sum, item) =>
            sum + item.quantity,
        0
    );


    /* =====================================================
       ADD PRODUCT
    ===================================================== */

    const addToCart = (
        product,
        quantity = 1
    ) => {

        setCart(current => {

            const existing =
                current.find(
                    item =>
                        item.id === product.id
                );

            if (existing) {

                return current.map(item =>
                    item.id === product.id
                        ? {
                            ...item,
                            quantity:
                                item.quantity +
                                quantity
                        }
                        : item
                );

            }

            return [
                ...current,
                {
                    id: product.id,
                    title: product.title,
                    cover: product.cover,
                    salePrice: product.salePrice,
                    regularPrice:
                        product.regularPrice,
                    quantity,
                    type: "Ebook",
                    product
                }
            ];

        });

        setCartOpen(true);
    };


    /* =====================================================
       ADD COMBO
    ===================================================== */

    const addCombo = combo => {

        const id =
            `combo-${combo.products
                .map(p => p.id)
                .join("-")}`;

        setCart(current => {

            const existing =
                current.find(
                    item => item.id === id
                );

            if (existing) {

                return current.map(item =>
                    item.id === id
                        ? {
                            ...item,
                            quantity:
                                item.quantity + 1
                        }
                        : item
                );

            }

            return [
                ...current,
                {
                    id,
                    title:
                        `Custom Combo — ${combo.products.length} Ebooks`,
                    cover:
                        combo.products[0].cover,
                    salePrice:
                        combo.salePrice,
                    regularPrice:
                        combo.regularPrice,
                    quantity: 1,
                    type: "Custom Combo",
                    product:
                        combo.products[0]
                }
            ];

        });

        setCartOpen(true);
    };


    /* =====================================================
       ADD BUNDLE
    ===================================================== */

    const addBundle = bundle => {

        const first =
            products.find(
                p =>
                    p.id ===
                    bundle.productIds[0]
            );

        setCart(current => {

            const existing =
                current.find(
                    item =>
                        item.id === bundle.id
                );

            if (existing) {

                return current.map(item =>
                    item.id === bundle.id
                        ? {
                            ...item,
                            quantity:
                                item.quantity + 1
                        }
                        : item
                );

            }

            return [
                ...current,
                {
                    id: bundle.id,
                    title: bundle.title,
                    cover: first?.cover,
                    salePrice: bundle.salePrice,
                    regularPrice:
                        bundle.regularPrice,
                    quantity: 1,
                    type: "Bundle",
                    product: first
                }
            ];

        });

        setCartOpen(true);
    };


    /* =====================================================
       NAVIGATION
    ===================================================== */

    const goHome = () => {

        setActiveProduct(null);

        setTimeout(() => {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }, 50);

    };


    const goEbooks = () => {

        setActiveProduct(null);

        setTimeout(() => {

            document
                .getElementById("ebooks")
                ?.scrollIntoView({
                    behavior: "smooth"
                });

        }, 50);

    };


    const goOffers = () => {

        setActiveProduct(null);

        setTimeout(() => {

            document
                .getElementById("offers")
                ?.scrollIntoView({
                    behavior: "smooth"
                });

        }, 50);

    };


    const goSupport = () => {

        setActiveProduct(null);

        setTimeout(() => {

            document
                .getElementById("support")
                ?.scrollIntoView({
                    behavior: "smooth"
                });

        }, 50);

    };


    /* =====================================================
       PRODUCT DETAIL PAGE
    ===================================================== */

    if (activeProduct) {

        return (

            <>

                <ProductDetailPage
                    product={activeProduct}
                    products={products}
                    onBack={() =>
                        setActiveProduct(null)
                    }
                    onAdd={addToCart}
                    onOpen={setActiveProduct}
                />


                <BottomNavigation
                    active="ebooks"
                    onHome={goHome}
                    onEbooks={goEbooks}
                    onCart={() =>
                        setCartOpen(true)
                    }
                    onOffers={goOffers}
                    onSupport={goSupport}
                    cartCount={cartCount}
                />


                {cartOpen && (

                    <CartDrawer
                        cart={cart}
                        setCart={setCart}
                        onClose={() =>
                            setCartOpen(false)
                        }
                        onOpenProduct={product => {

                            setCartOpen(false);

                            if (product) {
                                setActiveProduct(
                                    product
                                );
                            }

                        }}
                    />

                )}

            </>

        );

    }


    /* =====================================================
       STORE FRONT
    ===================================================== */

    return (

        <div className="min-h-screen bg-white">

            {/* OFFER TICKER */}

            <OfferTicker />


            {/* HEADER */}

            <Header
                cartCount={cartCount}
                onCart={() =>
                    setCartOpen(true)
                }
                onSearch={() =>
                    setSearchOpen(true)
                }
                onHome={goHome}
            />


            {/* HERO */}

            <main>

                <Hero
                    products={products}
                    currentIndex={heroIndex}
                    setCurrentIndex={setHeroIndex}
                    onOpen={setActiveProduct}
                    onAdd={addToCart}
                />


                {/* TRUST */}

                <TrustStrip />


                {/* EXPLORE */}

                <ExploreSection
                    products={products}
                    selectedCategory={
                        selectedCategory
                    }
                    setSelectedCategory={
                        setSelectedCategory
                    }
                    searchQuery={searchQuery}
                    setSearchQuery={setSearchQuery}
                    onOpen={setActiveProduct}
                    onAdd={addToCart}
                />


                {/* COMBO */}

                <ComboSection
                    products={products}
                    selected={comboSelected}
                    setSelected={setComboSelected}
                    onAddCombo={addCombo}
                />


                {/* BUNDLES */}

                <BundlesSection
                    products={products}
                    onAddBundle={addBundle}
                />


                {/* RATINGS */}

                <RatingsSection />


                {/* PROCESS */}

                <ProcessSection />


                {/* TESTIMONIALS */}

                <TestimonialsSection />


                {/* FAQ */}

                <FAQSection />


                {/* FINAL CTA */}

                <FinalCTA
                    onExplore={goEbooks}
                />


                {/* SUPPORT */}

                <SupportSection />

            </main>


            {/* FOOTER */}

            <Footer
                onHome={goHome}
                onExplore={goEbooks}
                onOffers={goOffers}
            />


            {/* MOBILE NAV */}

            <BottomNavigation
                active="home"
                onHome={goHome}
                onEbooks={goEbooks}
                onCart={() =>
                    setCartOpen(true)
                }
                onOffers={goOffers}
                onSupport={goSupport}
                cartCount={cartCount}
            />


            {/* SEARCH */}

            {searchOpen && (

                <SearchOverlay
                    products={products}
                    onClose={() =>
                        setSearchOpen(false)
                    }
                    onOpen={setActiveProduct}
                />

            )}


            {/* CART */}

            {cartOpen && (

                <CartDrawer
                    cart={cart}
                    setCart={setCart}
                    onClose={() =>
                        setCartOpen(false)
                    }
                    onOpenProduct={product => {

                        setCartOpen(false);

                        if (product) {
                            setActiveProduct(
                                product
                            );
                        }

                    }}
                />

            )}

        </div>
    );
}


/* =========================================================
   RENDER
========================================================= */

ReactDOM
    .createRoot(
        document.getElementById("root")
    )
    .render(
        <App />
    );

</script>

</body>
</html>
