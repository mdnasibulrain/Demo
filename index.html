/* =========================================================
   HELPERS
========================================================= */

function discountPercent(product) {
  if (!product.regularPrice) return 0;

  return Math.round(
    ((product.regularPrice - product.salePrice) /
      product.regularPrice) *
      100
  );
}


function money(value) {
  return `रु. ${Number(value).toLocaleString("en-IN")}`;
}


function createWhatsAppLink(message) {
  return `https://wa.me/${BRAND_CONFIG.whatsappRaw}?text=${encodeURIComponent(
    message
  )}`;
}


function productOrderMessage(product) {
  return `
नमस्ते StudyNotes 👋

म यो Ebook Order गर्न चाहन्छु:

📚 ${product.title}
💰 Price: ${money(product.salePrice)}
📄 ${product.pages} Pages
⭐ Rating: ${product.rating}/5

कृपया payment र delivery process बताइदिनुहोस्।

StudyNotes
WhatsApp Support: ${BRAND_CONFIG.whatsappNumber}
`.trim();
}

  ===================================================== */

    const query =
      searchQuery

        .trim();

    return products
      .filter(product => {

        if (!product.isPublished)
          return false;

        const categoryMatch =
          selectedCategory === "all" ||
          product.category === selectedCategory;

        const searchMatch =
          !query ||
          product.title.toLowerCase().includes(query) ||
          product.subtitle.toLowerCase().includes(query) ||
          product.summary.toLowerCase().includes(query) ||
          product.tags.some(tag =>
            tag.toLowerCase().includes(query)
          );

        return categoryMatch && searchMatch;
      })
      .sort((a, b) => {

        if (sortBy === "price-low")
          return a.salePrice - b.salePrice;

        if (sortBy === "price-high")
          return b.salePrice - a.salePrice;

        if (sortBy === "discount")
          return discountPercent(b) -
            discountPercent(a);

        if (sortBy === "rating")
          return b.rating - a.rating;

        if (sortBy === "newest")
          return Number(b.isNew) -
            Number(a.isNew);

        return Number(b.isFeatured) -

    let cartItem;

    if (type === "single") {

      cartItem = {
        id: item.id,
        title: item.title,
        cover: item.coverImage.source,
        salePrice: item.salePrice,
        regularPrice: item.regularPrice,
        quantity: 1,
        type: "Ebook"
      };

        title: `Custom Combo (${item.products.length} Ebooks)`,
        cover: item.products[0]?.coverImage.source,
        salePrice: item.salePrice,
        regularPrice: item.regularPrice,
        quantity: 1,
        type: "Custom Combo",
        items: item.products.map(
          product => product.title

      };

    } else {

      cartItem = {

        title: item.title,
        cover: item.image,
        salePrice: item.salePrice,
        regularPrice: item.regularPrice,
        quantity: 1,
        type: "Bundle",
        items: item.includedProductIds
      };
    }


    setCart(prev => {

      const existing =
        prev.find(
          item => item.id === cartItem.id

      if (existing) {

        return prev.map(item =>
          item.id === cartItem.id
